name: Validate pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_DB: goodmorning
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOODMORNING_ADMIN_DATABASE_URL: host=127.0.0.1 port=55432 dbname=goodmorning user=postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database test dependencies
        run: pip install 'psycopg[binary]==3.3.9' 'psycopg-pool==3.3.3' 'pgvector==0.5.1' 'numpy==2.5.5' 'pytest==9.2.0' 'fastapi==0.165.0' 'httpx==0.28.1'
      - name: Check isolated database integrity
        run: python -m pytest server/test_diary_store.py server/test_social_auth.py server/test_db_security.py -q
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Check Python syntax
        run: python3 -m compileall -q server scripts
      - name: Prepare frontend
        run: python3 scripts/prepare_frontend.py
      - run: flutter pub get
        working-directory: app
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
        working-directory: app
      - run: python3 scripts/finalize_web.py
      - name: Scan build artifact
        run: python3 scripts/check_secrets.py --artifact app/build/web
